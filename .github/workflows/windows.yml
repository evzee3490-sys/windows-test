name: Windows Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025

    steps:
      - name: Check Windows Resources
        shell: powershell
        run: |
          Write-Host "=== Windows Runner ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption,
              @{Name="RAM_GB";Expression={[math]::Round($_.TotalVisibleMemorySize/1MB,2)}}

          Write-Host "=== CPU ==="
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          - name: Install Google Chrome
        shell: powershell
        run: |
          $url = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installer = "$env:TEMP\chrome_installer.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process $installer -ArgumentList "/silent","/install" -Wait
          Remove-Item $installer -Force

          Write-Host "Chrome installation completed."
